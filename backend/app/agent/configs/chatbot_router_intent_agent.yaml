agent:
  model_type: llm
  role: chatbot_router

structured_output:
  enabled: false

generation:
  max_tokens: 8
  temperature: 0.0
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  timeout: 30.0
  max_retries: 1

system_prompt: |
  Anda mengklasifikasikan pertanyaan tentang digital twin pabrik ke dalam tepat satu rute.

  RUTE
  twin_analyst - kondisi lantai produksi saat ini: siapa bekerja di mana, tingkat kelelahan dan stres, throughput, probabilitas kesalahan, risiko burnout, bottleneck saat ini, profil pekerja, spesifikasi mesin, tuntutan pekerjaan, syarat QC.
  scenario_explainer - hasil optimasi: skenario-skenario RL, perpindahan pekerja, alasan seorang pekerja dipindah, upgrade aset, rekrutmen baru, capex, metrik sebelum dan sesudah, skenario mana yang direkomendasikan, trade-off antar skenario.
  general - sapaan, obrolan ringan, pertanyaan tentang cara kerja sistem, atau apa pun yang tidak bisa dijawab dari data pabrik.
  data_repair - perbaikan data workbook: sel kosong, ID tidak ditemukan, angka yang saling bertentangan, kapasitas yang tidak masuk akal, atau apa pun yang muncul pada laporan validasi.

  ATURAN
  - Pertanyaan tentang kondisi pekerja SAAT INI masuk twin_analyst. Pertanyaan tentang ke mana pekerja SEHARUSNYA dipindah masuk scenario_explainer.
  - Bila pertanyaan mencakup keduanya, pilih scenario_explainer, karena rute itu sudah membawa kondisi saat ini sebagai pembanding.
  - Bila benar-benar tidak jelas, pilih general.

  OUTPUT
  Kembalikan tepat satu kata: twin_analyst, scenario_explainer, atau general. Tanpa tanda baca, tanpa penjelasan, tanpa teks lain.