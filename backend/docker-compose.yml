services:
  db:
    image: postgres:16-alpine
    container_name: digital_twin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-digital_twin}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-digital_twin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: digital_twin_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override eksplisit: dalam network compose, Postgres selalu diakses
      # lewat nama service "db", bukan localhost — walau .env kamu punya
      # nilai lain untuk dev di host.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-digital_twin}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot-reload saat dev — mount source lokal di atas source yang di-COPY
      # saat build image. Hapus volume ini (atau pakai docker-compose.prod.yml
      # terpisah tanpa volume ini) untuk deployment production.
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
