# docker-compose.yml
version: "3.9"

networks:
  pabrikers-net:
    external: true
    name: pabrikers-net

volumes:
  postgres_data:
  pgadmin_data:
  ml_model_cache:

services:

  # ==========================================
  # Database
  # ==========================================
  database-server:
    image: postgres:16-alpine
    container_name: database-server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pabrikers-net

  database-admin-server:
    image: dpage/pgadmin4:latest
    container_name: database-admin-server
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      database-server:
        condition: service_healthy
    networks:
      - pabrikers-net

  # ==========================================
  # Backend (FastAPI)
  # ==========================================
  backend-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-server
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database-server:5432/${POSTGRES_DB}
      ML_SERVER_URL: http://ml-server:8010
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      database-server:
        condition: service_healthy
      ml-server:
        condition: service_healthy
    networks:
      - pabrikers-net

  # ==========================================
  # Frontend
  # ==========================================
  frontend-server:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-server
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://backend-server:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend-server:
        condition: service_healthy
    networks:
      - pabrikers-net

  # ==========================================
  # Nginx reverse proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend-server:
        condition: service_healthy
      frontend-server:
        condition: service_started
    networks:
      - pabrikers-net