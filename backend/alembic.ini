# alembic.ini
# Konfigurasi Alembic untuk project ini.
# sqlalchemy.url SENGAJA dibiarkan kosong/placeholder — env.py meng-override
# paksa pakai settings.DATABASE_URL (satu source of truth tetap di .env),
# jadi baris di bawah ini tidak pernah benar-benar dipakai, hanya supaya
# key-nya tidak error kalau ada tool lain yang expect key ini ada.

[alembic]
# path ke folder alembic (env.py, script.py.mako, versions/)
script_location = alembic

# template nama file migration — pakai timestamp di depan supaya file
# terurut kronologis di file explorer, bukan cuma di `alembic history`
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone untuk timestamp di atas
timezone = UTC

# jangan sertakan revision hash yang tidak dipakai di file_template ke .gitignore, dst.
truncate_slug_length = 40

# jangan izinkan `alembic revision` tanpa --autogenerate ATAU tanpa isi
# migration sama sekali — mencegah commit file migration kosong tak sengaja
revision_environment = false

sourceless = false

# lokasi file version — default sudah versions/ di dalam script_location
version_locations = %(here)s/alembic/versions

version_path_separator = os

# placeholder — TIDAK dipakai, env.py override dengan settings.DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# hook opsional buat auto-format file migration hasil autogenerate.
# Uncomment kalau ruff/black sudah ada di requirements.txt:
#
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration — WAJIB ada, karena env.py memanggil
# fileConfig(config.config_file_name) untuk setup logging Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S