services:
  postgres:
    image: postgres:17
    container_name: pg-khotbah-qa
    environment:
      POSTGRES_USER: AIRG
      POSTGRES_PASSWORD: AIRGP4ss
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data_chatbot

  pgadmin:
    image: dpage/pgadmin4
    container_name: chatbot_khotbah_DB
    environment:
      PGADMIN_DEFAULT_EMAIL: CRC@example.com
      PGADMIN_DEFAULT_PASSWORD: CRCPASS
    ports:
      - "5000:80"

volumes:
  pgdata: