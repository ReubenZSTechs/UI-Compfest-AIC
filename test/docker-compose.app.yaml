services:
  fastapi:
    build:
      context: ../../
      dockerfile: deployment/docker/vllm.Dockerfile
    container_name: fastapi-server
    runtime: nvidia
    ports:
      - "15000:15000"
    environment:
      - GEMMA_URL=http://gemma4-31b:8000/v1
      - QWEN_URL=http://qwen36:8001/v1
      - DEEPSEEK_URL=http://deepseek-r1:8002/v1
      - TRANSLATE_URL=http://translategemma:8004/v1
      - BGE_M3_URL=http://bge-m3:8005/v1
      - GPT_API_KEY=${GPT_API_KEY}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI_HOST=bolt://neo4j:7687
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: pg-khotbah-qa
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5332:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: chatbot_khotbah_DB
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-server
    ports:
      - "7474:7474" # HTTP interface
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=8G
      - NEO4J_server_memory_heap_max__size=8G
      - NEO4J_server_memory_pagecache_size=8G
      # - NEO4J_server_logs_debug_level=ERROR
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # neo4j:
  #   image: neo4j:5.26-community
  #   container_name: neo4j-server
  #   ports:
  #     - "7474:7474" # HTTP interface
  #     - "7687:7687" # Bolt protocol
  #   environment:
  #     - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
