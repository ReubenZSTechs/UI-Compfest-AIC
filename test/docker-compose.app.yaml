networks:
  default:
    name: khotbah-net
    external: true

volumes:
  pgdata:
    name: khotbah_qa_app_pgdata
    external: true
  pgadmin_data:
    name: khotbah_qa_app_pgadmin_data
    external: true
  neo4j_data:
    name: khotbah_qa_app_neo4j_data
    external: true
  neo4j_logs:
    name: khotbah_qa_app_neo4j_logs
    external: true
  neo4j_import:
    name: khotbah_qa_app_neo4j_import
    external: true
  neo4j_plugins:
    name: khotbah_qa_app_neo4j_plugins
    external: true