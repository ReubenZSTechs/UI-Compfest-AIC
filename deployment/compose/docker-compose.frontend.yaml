services:
  frontend:
    build:
      context: ../../
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    container_name: compfest_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - compfest-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 50s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  compfest-net:
    external: true