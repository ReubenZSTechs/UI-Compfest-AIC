server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers (basic)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker's embedded DNS resolver — lets nginx resolve "backend" lazily
    # per-request instead of once at startup, so it won't crash if the
    # backend container is briefly down, restarting, or not up yet.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback - all non-file routes go to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container.
    # IMPORTANT: no trailing slash after $backend_upstream in proxy_pass.
    # Backend's routes are mounted under settings.API_V1_PREFIX = "/api/v1"
    # (see app/main.py + app/core/config.py), so the "/api/" prefix must be
    # forwarded AS-IS, not stripped. A trailing slash here would strip it
    # and every request would 404 against the backend.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # NOTE: WebSocket proxy removed — simulation engine sekarang murni
    # client-side (tick loop di frontend) yang fetch config sekali lewat
    # REST GET /api/v1/simulation/config. Backend tidak lagi punya endpoint
    # /ws apapun, jadi block ini dead code kalau dipertahankan.

    # Cache hashed static assets aggressively (Vite outputs content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache index.html so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}